<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooking Plan - Giao diện Phương án A (Cập nhật)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col items-center justify-start p-2 sm:p-6 pb-20">

  <!-- Header Info -->
  <header class="w-full max-w-md mb-3 text-center">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white shadow-sm border border-slate-200 text-xs text-slate-600 mb-1.5">
      <span class="w-2.5 h-2.5 rounded-full bg-[#FEF7DC] border border-[#E8DCA8]"></span>
      Tone màu: <b>Dusty Blue</b> (#5B7C99) & <b>Pastel Cream</b> (#FEF7DC)
    </div>
    <h1 class="text-xl font-bold text-[#334E68]">Phương Án A (Đã cập nhật theo yêu cầu)</h1>
    <p class="text-xs text-slate-500">Màn hình Kế Hoạch Bữa Ăn & Chọn Món có tính năng Tìm Kiếm</p>
  </header>

  <!-- Mobile Phone Mockup -->
  <div class="w-full max-w-[400px] bg-white rounded-[40px] shadow-2xl border-[7px] border-slate-800 overflow-hidden relative flex flex-col h-[780px]">
    
    <!-- Phone Top Status Bar -->
    <div class="w-full bg-slate-900 pt-3 pb-2 px-6 flex items-center justify-between text-white text-[11px] select-none z-30">
      <span class="font-medium">19:30</span>
      <div class="w-20 h-4 bg-black rounded-full mx-auto -mt-1"></div>
      <div class="flex items-center gap-1">
        <span>5G</span>
        <div class="w-4 h-2 border border-white rounded-sm p-[1px] flex items-center"><div class="w-2.5 h-full bg-white"></div></div>
      </div>
    </div>

    <!-- Active View Container -->
    <div id="app-root" class="flex-1 flex flex-col overflow-y-auto relative bg-[#FAFBFD]">
      <!-- Rendered dynamically -->
    </div>

    <!-- App Bottom Nav Bar -->
    <div class="w-full bg-white/95 backdrop-blur border-t border-slate-100 px-6 py-2.5 flex items-center justify-around z-20">
      <button class="flex flex-col items-center gap-0.5 text-[#5B7C99] font-bold text-xs">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span>Kế hoạch</span>
      </button>
      <button onclick="alert('Màn hình Menu quản lý các Món ăn của gia đình.')" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-[#5B7C99] transition text-xs">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        <span>Menu</span>
      </button>
    </div>

    <!-- Phone Home Indicator Bar -->
    <div class="w-full bg-white pb-2 flex justify-center">
      <div class="w-32 h-1 bg-slate-300 rounded-full"></div>
    </div>

    <!-- Drawer / Modal Host -->
    <div id="modal-host"></div>
  </div>

  <script>
    // --- Application State ---
    const STATE = {
      activeDateIndex: 1, // Thứ 3 (hôm nay)
      activeMeal: 'dinner', // Luôn ưu tiên Bữa Tối mặc định!
      householdCode: 'BEP-892',
      nickname: 'Mẹ',
      searchQuery: '',
      weekDays: [
        { label: 'T2', date: '28/09', full: 'Thứ Hai, 28 Th09' },
        { label: 'T3', date: '29/09', full: 'Thứ Ba, 29 Th09', today: true },
        { label: 'T4', date: '30/09', full: 'Thứ Tư, 30 Th09' },
        { label: 'T5', date: '01/10', full: 'Thứ Năm, 01 Th10' },
        { label: 'T6', date: '02/10', full: 'Thứ Sáu, 02 Th10' },
        { label: 'T7', date: '03/10', full: 'Thứ Bảy, 03 Th10' },
        { label: 'CN', date: '04/10', full: 'Chủ Nhật, 04 Th10' }
      ],
      menu: [
        { id: 'm1', name: 'Thịt ba chỉ kho trứng', tag: 'Món mặn' },
        { id: 'm2', name: 'Canh chua cá lóc', tag: 'Canh' },
        { id: 'm3', name: 'Rau muống xào tỏi', tag: 'Xào' },
        { id: 'm4', name: 'Sườn xào chua ngọt', tag: 'Món mặn' },
        { id: 'm5', name: 'Canh cua mồng tơi', tag: 'Canh' },
        { id: 'm6', name: 'Bò xào bông cải', tag: 'Xào' },
        { id: 'm7', name: 'Trứng chiên hành', tag: 'Món mặn' },
        { id: 'm8', name: 'Cá hồi áp chảo sốt bơ tỏi', tag: 'Món mặn' },
        { id: 'm9', name: 'Canh bí đỏ nấu sườn', tag: 'Canh' },
        { id: 'm10', name: 'Phở bò gia đình', tag: 'Ăn sáng' }
      ],
      plans: {
        1: { // Thứ 3
          dinner: [
            { 
              dishId: 'm1', 
              name: 'Thịt ba chỉ kho trứng', 
              tag: 'Món mặn',
              comments: [
                { author: 'Bố', time: '10:15', text: 'Mua thịt ba chỉ ít mỡ nhé em ơi' },
                { author: 'Mẹ', time: '11:30', text: 'Nhớ ướp nước dừa xiêm cho thơm nha' }
              ]
            },
            { 
              dishId: 'm2', 
              name: 'Canh chua cá lóc', 
              tag: 'Canh',
              comments: []
            }
          ],
          lunch: [
            { dishId: 'm7', name: 'Trứng chiên hành', tag: 'Món mặn', comments: [] }
          ],
          breakfast: []
        }
      },
      isSelectorOpen: false,
      isDetailOpen: false,
      activeDetailDish: null,
      tempSelectedDishIds: []
    };

    function selectDate(idx) {
      STATE.activeDateIndex = idx;
      STATE.activeMeal = 'dinner'; // Always dinner-first!
      render();
    }

    function switchMeal(meal) {
      STATE.activeMeal = meal;
      render();
    }

    function openDishSelector() {
      STATE.tempSelectedDishIds = [];
      STATE.searchQuery = '';
      STATE.isSelectorOpen = true;
      render();
    }

    function closeDishSelector() {
      STATE.isSelectorOpen = false;
      render();
    }

    function handleSearch(val) {
      STATE.searchQuery = val;
      renderModal();
    }

    function toggleSelectDish(dishId) {
      const idx = STATE.tempSelectedDishIds.indexOf(dishId);
      if (idx > -1) {
        STATE.tempSelectedDishIds.splice(idx, 1);
      } else {
        STATE.tempSelectedDishIds.push(dishId);
      }
      renderModal();
    }

    function confirmAddDishes() {
      if (!STATE.plans[STATE.activeDateIndex]) {
        STATE.plans[STATE.activeDateIndex] = { dinner: [], lunch: [], breakfast: [] };
      }
      if (!STATE.plans[STATE.activeDateIndex][STATE.activeMeal]) {
        STATE.plans[STATE.activeDateIndex][STATE.activeMeal] = [];
      }

      STATE.tempSelectedDishIds.forEach(id => {
        const dish = STATE.menu.find(m => m.id === id);
        if (dish) {
          const exists = STATE.plans[STATE.activeDateIndex][STATE.activeMeal].some(d => d.dishId === id);
          if (!exists) {
            STATE.plans[STATE.activeDateIndex][STATE.activeMeal].push({
              dishId: dish.id,
              name: dish.name,
              tag: dish.tag,
              comments: []
            });
          }
        }
      });

      STATE.isSelectorOpen = false;
      render();
    }

    function removeDishFromMeal(dishId, event) {
      if (event) event.stopPropagation();
      const currentList = STATE.plans[STATE.activeDateIndex]?.[STATE.activeMeal] || [];
      STATE.plans[STATE.activeDateIndex][STATE.activeMeal] = currentList.filter(d => d.dishId !== dishId);
      render();
    }

    function openDishDetail(dish) {
      STATE.activeDetailDish = dish;
      STATE.isDetailOpen = true;
      render();
    }

    function closeDishDetail() {
      STATE.isDetailOpen = false;
      STATE.activeDetailDish = null;
      render();
    }

    function submitComment(event) {
      event.preventDefault();
      const input = document.getElementById('comment-input');
      const text = input?.value?.trim();
      if (!text || !STATE.activeDetailDish) return;

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      STATE.activeDetailDish.comments.push({
        author: STATE.nickname,
        time: timeStr,
        text: text
      });
      input.value = '';
      renderModal();
    }

    function getCurrentMealDishes() {
      return STATE.plans[STATE.activeDateIndex]?.[STATE.activeMeal] || [];
    }

    function getMealLabel(meal) {
      if (meal === 'breakfast') return 'Bữa Sáng';
      if (meal === 'lunch') return 'Bữa Trưa';
      return 'Bữa Tối';
    }

    function renderMainView() {
      const activeDay = STATE.weekDays[STATE.activeDateIndex];
      const dishes = getCurrentMealDishes();

      return `
        <!-- Top Household Bar -->
        <div class="px-5 pt-4 pb-3 bg-white border-b border-slate-100 flex items-center justify-between">
          <div>
            <div class="flex items-center gap-1.5">
              <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-[#FEF7DC] text-[#334E68] border border-[#EFE4B5]">Mã: ${STATE.householdCode}</span>
              <span class="text-xs text-slate-500">• ${STATE.nickname}</span>
            </div>
            <h2 class="text-lg font-bold text-[#334E68] mt-0.5">Kế hoạch tuần này</h2>
          </div>
          <div class="flex items-center gap-1">
            <button class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition" title="Tuần trước">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <button class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition" title="Tuần sau">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>

        <!-- Date Ribbon (Horizontal Scrollable Strip) -->
        <div class="bg-white px-4 py-3 flex gap-2 overflow-x-auto shadow-xs border-b border-slate-100">
          ${STATE.weekDays.map((d, idx) => {
            const isSelected = idx === STATE.activeDateIndex;
            return `
              <button onclick="selectDate(${idx})" class="flex-shrink-0 flex flex-col items-center justify-center w-12 py-2 rounded-2xl transition-all ${
                isSelected 
                  ? 'bg-gradient-to-b from-[#5B7C99] to-[#456380] text-white shadow-md shadow-[#5B7C99]/30 scale-105' 
                  : 'bg-slate-50 text-slate-600 hover:bg-slate-100'
              }">
                <span class="text-[10px] font-medium opacity-80 uppercase">${d.label}</span>
                <span class="text-xs font-bold mt-0.5">${d.date.split('/')[0]}</span>
                ${d.today ? `<span class="w-1.5 h-1.5 rounded-full mt-1 ${isSelected ? 'bg-[#FEF7DC]' : 'bg-[#5B7C99]'}"></span>` : ''}
              </button>
            `;
          }).join('')}
        </div>

        <!-- Content Area -->
        <div class="p-4 flex-1 flex flex-col">
          
          <!-- Meal Header & Dinner-First Selector -->
          <div class="mb-4">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">${activeDay.full}</span>
              ${STATE.activeMeal === 'dinner' ? `<span class="text-[11px] font-semibold text-[#334E68] bg-[#FEF7DC] px-2.5 py-0.5 rounded-full border border-[#EFE4B5]">✨ Bữa chính</span>` : ''}
            </div>

            <!-- Soft Rounded Tabs with #FEF7DC Highlight -->
            <div class="p-1 rounded-2xl bg-slate-200/60 flex gap-1">
              <button onclick="switchMeal('breakfast')" class="flex-1 py-1.5 rounded-xl text-xs font-medium transition ${
                STATE.activeMeal === 'breakfast' ? 'bg-white text-[#334E68] shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900'
              }">Sáng</button>
              <button onclick="switchMeal('lunch')" class="flex-1 py-1.5 rounded-xl text-xs font-medium transition ${
                STATE.activeMeal === 'lunch' ? 'bg-white text-[#334E68] shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900'
              }">Trưa</button>
              <button onclick="switchMeal('dinner')" class="flex-1 py-1.5 rounded-xl text-xs font-medium transition relative ${
                STATE.activeMeal === 'dinner' ? 'bg-[#FEF7DC] text-[#334E68] border border-[#EFE4B5] shadow-sm font-bold' : 'text-slate-600 hover:text-[#334E68]'
              }">
                Tối
                ${STATE.activeMeal === 'dinner' ? `<span class="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-[#5B7C99]"></span>` : ''}
              </button>
            </div>
          </div>

          <!-- Dishes Card List in Current Meal -->
          <div class="flex-1 flex flex-col">
            <div class="flex items-center justify-between mb-2.5">
              <h3 class="text-sm font-bold text-[#334E68] flex items-center gap-1.5">
                <span>${getMealLabel(STATE.activeMeal)}</span>
                <span class="text-xs px-2 py-0.2 rounded-full bg-slate-200/80 text-slate-600">${dishes.length} món</span>
              </h3>
              
              <!-- Soft Rounded Button to Add Dishes -->
              <button onclick="openDishSelector()" class="inline-flex items-center gap-1 px-3.5 py-1.5 rounded-full bg-[#FEF7DC] hover:bg-[#FDF2C7] text-[#334E68] text-xs font-bold transition active:scale-95 border border-[#EFE4B5] shadow-xs">
                <svg class="w-3.5 h-3.5 text-[#5B7C99]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                Thêm món
              </button>
            </div>

            <!-- Empty or List of Dishes -->
            ${dishes.length === 0 ? `
              <div class="flex-1 flex flex-col items-center justify-center p-6 text-center border-2 border-dashed border-slate-200 rounded-3xl bg-white/60 my-2">
                <div class="w-12 h-12 rounded-full bg-[#FEF7DC] text-[#334E68] border border-[#EFE4B5] flex items-center justify-center mb-2">
                  <svg class="w-6 h-6 text-[#5B7C99]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                </div>
                <p class="text-xs font-bold text-slate-700">Chưa có món nào cho ${getMealLabel(STATE.activeMeal)}</p>
                <p class="text-[11px] text-slate-400 mt-1 max-w-[190px]">Bấm nút thêm món từ Menu của nhà để lên kế hoạch</p>
                <button onclick="openDishSelector()" class="mt-3 px-4 py-1.5 rounded-full bg-[#5B7C99] text-white text-xs font-bold hover:bg-[#4a6b88] transition shadow-sm">
                  + Chọn từ Menu
                </button>
              </div>
            ` : `
              <div class="space-y-2.5 overflow-y-auto pr-0.5">
                ${dishes.map(d => `
                  <div onclick="openDishDetail(${JSON.stringify(d).replace(/"/g, '&quot;')})" class="group bg-white hover:bg-slate-50 border border-slate-100 p-3.5 rounded-2xl shadow-sm hover:shadow transition cursor-pointer flex items-center justify-between">
                    <div class="flex items-center gap-3">
                      <div class="w-10 h-10 rounded-xl bg-[#EBF1F6] text-[#5B7C99] flex items-center justify-center font-bold text-sm">
                        🍲
                      </div>
                      <div>
                        <div class="flex items-center gap-1.5">
                          <h4 class="text-xs font-bold text-[#334E68]">${d.name}</h4>
                          ${d.tag ? `<span class="text-[10px] px-1.5 py-0.2 rounded-md bg-[#FEF7DC] text-[#334E68] border border-[#EFE4B5]">${d.tag}</span>` : ''}
                        </div>
                        <p class="text-[11px] text-[#5B7C99] font-medium mt-0.5 flex items-center gap-1">
                          <svg class="w-3 h-3 text-[#5B7C99]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                          <span>${d.comments.length > 0 ? `${d.comments.length} dặn dò` : 'Bấm để thêm dặn dò'}</span>
                        </p>
                      </div>
                    </div>
                    <button onclick="removeDishFromMeal('${d.dishId}', event)" class="w-7 h-7 rounded-full text-slate-300 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition" title="Gỡ món khỏi bữa">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

        </div>
      `;
    }

    function renderModal() {
      const host = document.getElementById('modal-host');
      if (!host) return;

      // DISH SELECTOR WITH SEARCH
      if (STATE.isSelectorOpen) {
        const mealTitle = getMealLabel(STATE.activeMeal);
        const q = STATE.searchQuery.toLowerCase().trim();
        const filteredMenu = STATE.menu.filter(m => 
          m.name.toLowerCase().includes(q) || (m.tag && m.tag.toLowerCase().includes(q))
        );

        host.innerHTML = `
          <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-xs z-40 transition-opacity flex flex-col justify-end" onclick="closeDishSelector()">
            <div class="bg-white rounded-t-[32px] p-5 pt-3 shadow-2xl max-h-[88%] flex flex-col border-t border-slate-100 animate-in slide-in-from-bottom duration-200" onclick="event.stopPropagation()">
              
              <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-3"></div>
              
              <div class="flex items-center justify-between mb-2">
                <div>
                  <h3 class="text-base font-bold text-[#334E68]">Chọn món cho ${mealTitle}</h3>
                  <p class="text-[11px] text-slate-400">Tick chọn món từ Menu của gia đình</p>
                </div>
                <button onclick="closeDishSelector()" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center font-bold text-xs">✕</button>
              </div>

              <!-- SEARCH INPUT -->
              <div class="relative my-2">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <input 
                  type="text" 
                  id="dish-search-input"
                  value="${STATE.searchQuery}"
                  oninput="handleSearch(this.value)"
                  placeholder="Tìm món ăn hoặc phân loại..." 
                  class="w-full pl-9 pr-8 py-2 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#5B7C99] focus:bg-white transition"
                  autofocus
                >
                ${STATE.searchQuery ? `
                  <button onclick="handleSearch(''); document.getElementById('dish-search-input').focus();" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">✕</button>
                ` : ''}
              </div>

              <!-- Filtered Dish List -->
              <div class="flex-1 overflow-y-auto py-1 space-y-2 max-h-[300px]">
                ${filteredMenu.length === 0 ? `
                  <div class="py-8 text-center text-slate-400 text-xs">
                    <p>Không tìm thấy món ăn nào phù hợp với "<b>${STATE.searchQuery}</b>"</p>
                  </div>
                ` : filteredMenu.map(m => {
                  const isChecked = STATE.tempSelectedDishIds.includes(m.id);
                  return `
                    <div onclick="toggleSelectDish('${m.id}')" class="p-3 rounded-2xl border transition cursor-pointer flex items-center justify-between ${
                      isChecked ? 'bg-[#FEF7DC] border-[#EFE4B5] shadow-xs' : 'bg-slate-50 border-slate-100 hover:bg-slate-100/70'
                    }">
                      <div>
                        <p class="text-xs font-bold text-[#334E68]">${m.name}</p>
                        ${m.tag ? `<span class="text-[10px] text-slate-400">${m.tag}</span>` : ''}
                      </div>
                      <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center ${
                        isChecked ? 'bg-[#5B7C99] border-[#5B7C99] text-white' : 'border-slate-300'
                      }">
                        ${isChecked ? `<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Confirm Action Button -->
              <div class="pt-3 border-t border-slate-100">
                <button onclick="confirmAddDishes()" class="w-full py-3 rounded-full bg-[#5B7C99] hover:bg-[#4a6b88] text-white font-bold text-xs shadow-md shadow-[#5B7C99]/30 transition active:scale-98">
                  Xác nhận thêm (${STATE.tempSelectedDishIds.length} món)
                </button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // DISH DETAIL & BLANK COMMENT
      if (STATE.isDetailOpen && STATE.activeDetailDish) {
        const dish = STATE.activeDetailDish;

        host.innerHTML = `
          <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex flex-col justify-end" onclick="closeDishDetail()">
            <div class="bg-white rounded-t-[32px] p-5 shadow-2xl max-h-[85%] flex flex-col border-t border-slate-100" onclick="event.stopPropagation()">
              
              <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-3"></div>

              <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <div>
                  <span class="text-[10px] font-semibold text-[#5B7C99] uppercase tracking-wider">Chi tiết món ăn</span>
                  <h3 class="text-base font-extrabold text-[#334E68]">${dish.name}</h3>
                </div>
                <button onclick="closeDishDetail()" class="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center text-xs font-bold">✕</button>
              </div>

              <div class="flex-1 overflow-y-auto py-3 space-y-2.5 max-h-[220px]">
                <div class="text-[11px] font-semibold text-slate-400">Dặn dò của gia đình:</div>
                ${dish.comments.length === 0 ? `
                  <p class="text-xs text-slate-400 italic py-2">Chưa có dặn dò nào cho món này.</p>
                ` : dish.comments.map(c => `
                  <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-100">
                    <div class="flex items-center justify-between text-[11px] mb-1">
                      <span class="font-bold text-[#5B7C99]">${c.author}</span>
                      <span class="text-slate-400 text-[10px]">${c.time}</span>
                    </div>
                    <p class="text-xs text-slate-700">${c.text}</p>
                  </div>
                `).join('')}
              </div>

              <form onsubmit="submitComment(event)" class="pt-3 border-t border-slate-100">
                <label for="comment-input" class="text-[11px] font-semibold text-slate-600 block mb-1">
                  Viết dặn dò (cách nấu, chuẩn bị nguyên liệu):
                </label>
                <div class="relative">
                  <textarea id="comment-input" rows="2" placeholder="Nhập dặn dò cho món này..." class="w-full text-xs p-3 rounded-2xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-[#5B7C99] focus:bg-white resize-none"></textarea>
                  <button type="submit" class="mt-2 w-full py-2.5 rounded-full bg-[#5B7C99] hover:bg-[#4a6b88] text-white font-bold text-xs shadow-md shadow-[#5B7C99]/30 transition active:scale-98">
                    Gửi dặn dò
                  </button>
                </div>
              </form>

            </div>
          </div>
        `;
        return;
      }

      host.innerHTML = '';
    }

    function render() {
      const root = document.getElementById('app-root');
      if (!root) return;
      root.innerHTML = renderMainView();
      renderModal();
    }

    render();
  </script>
</body>
</html>
