<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooking Plan - UI Prototype: Màn Hình Chọn & Thêm Thành Viên</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .tap-highlight-none {
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(1deg); }
    }
    .animate-wiggle {
      animation: wiggle 0.25s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col items-center justify-start p-2 sm:p-6 pb-28">

  <!-- Header Info -->
  <header class="w-full max-w-xl mb-4 text-center">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-xs text-slate-300 mb-2">
      <span class="w-2 h-2 rounded-full bg-[#FEF7DC]"></span>
      UI Prototype Exploration • 3 Phương Án Chọn & Thêm Thành Viên
    </div>
    <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight" id="variant-title">
      Đang tải phương án xem trước...
    </h1>
    <p class="text-xs sm:text-sm text-slate-400 mt-1 max-w-md mx-auto" id="variant-description">
      Chuyển đổi phương án bằng thanh điều khiển bên dưới hoặc phím mũi tên ← →.
    </p>
  </header>

  <!-- Mobile Phone Mockup Frame -->
  <div class="w-full max-w-[400px] bg-[#FAFBFD] text-slate-800 rounded-[44px] shadow-2xl border-[8px] border-slate-800 overflow-hidden relative flex flex-col h-[780px]">
    
    <!-- Phone Top Status Bar -->
    <div class="w-full bg-[#FAFBFD] pt-3 pb-1.5 px-6 flex items-center justify-between text-slate-800 text-[11px] select-none z-30 flex-shrink-0">
      <span class="font-bold">19:30</span>
      <div class="w-24 h-4 bg-slate-800 rounded-full mx-auto -mt-1 flex items-center justify-end pr-2">
        <span class="w-2.5 h-2.5 rounded-full bg-slate-700/80"></span>
      </div>
      <div class="flex items-center gap-1.5 font-bold">
        <span class="text-[10px] text-[#5B7C99]">5G</span>
        <div class="w-4 h-2 border border-slate-700 rounded-xs p-[1px] flex items-center">
          <div class="w-2.5 h-full bg-slate-700"></div>
        </div>
      </div>
    </div>

    <!-- Active View Container (Main App Body) -->
    <div id="app-root" class="flex-1 flex flex-col overflow-y-auto relative bg-[#FAFBFD]">
      <!-- Content rendered dynamically via JavaScript -->
    </div>

    <!-- Phone Home Indicator Bar -->
    <div class="w-full bg-white pb-2 flex justify-center flex-shrink-0">
      <div class="w-32 h-1 bg-slate-300 rounded-full"></div>
    </div>

    <!-- Overlay Host for Add Member Drawer/Modal -->
    <div id="overlay-host"></div>
  </div>

  <!-- State inspector info -->
  <div class="mt-3 text-center text-xs text-slate-400 max-w-md">
    <span class="text-[#FEF7DC] font-semibold">● Trạng thái bộ nhớ:</span> 
    <span id="state-summary">Gia đình BEP-892 có 3 Thành viên. Chưa chọn thành viên vào bếp.</span>
  </div>

  <!-- FLOATING PROTOTYPE SWITCHER (bottom center) -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 bg-slate-800/95 backdrop-blur-md text-white px-4 py-2.5 rounded-full shadow-2xl border border-slate-700">
    <button onclick="cycleVariant(-1)" class="w-7 h-7 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-slate-200 transition active:scale-95" title="Phương án trước (Phím ←)">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="flex flex-col items-center px-2 select-none min-w-[220px] text-center">
      <div class="text-[10px] font-bold text-[#FEF7DC] uppercase tracking-wider" id="switcher-variant-key">Phương án A</div>
      <div class="text-xs font-bold text-white truncate max-w-[240px]" id="switcher-variant-name">Netflix Kitchen Cards</div>
    </div>
    <button onclick="cycleVariant(1)" class="w-7 h-7 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-slate-200 transition active:scale-95" title="Phương án sau (Phím →)">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <script>
    // --- SAMPLE DATA & PALETTE (Matching Plan Tone & Colors) ---
    const AVATAR_PRESETS = [
      { icon: '🍳', bg: 'bg-[#FEF7DC]', border: 'border-[#EFE4B5]', label: 'Chảo ốp la' },
      { icon: '🥗', bg: 'bg-[#DCFCE7]', border: 'border-[#BBF7D0]', label: 'Salad tươi' },
      { icon: '🍜', bg: 'bg-[#E0F2FE]', border: 'border-[#BAE6FD]', label: 'Mì thơm' },
      { icon: '🥑', bg: 'bg-[#ECFCCB]', border: 'border-[#D9F99D]', label: 'Bơ béo' },
      { icon: '🍰', bg: 'bg-[#FCE7F3]', border: 'border-[#FBCFE8]', label: 'Bánh kem' },
      { icon: '🍕', bg: 'bg-[#FFEDD5]', border: 'border-[#FED7AA]', label: 'Pizza nóng' },
      { icon: '🥕', bg: 'bg-[#FEF3C7]', border: 'border-[#FDE68A]', label: 'Cà rốt ngọt' },
      { icon: '🍲', bg: 'bg-[#F3E8FF]', border: 'border-[#E9D5FF]', label: 'Lẩu gia đình' },
    ];

    let state = {
      householdCode: 'BEP-892',
      selectedMemberId: null,
      isManageMode: false,
      isAddModalOpen: false,
      activeScreen: 'select', // 'select' | 'plan'
      editingMemberId: null,
      members: [
        { id: 'm1', name: 'Mẹ', icon: '🍳', bg: 'bg-[#FEF7DC]', border: 'border-[#EFE4B5]', role: 'Bếp trưởng chính' },
        { id: 'm2', name: 'Bố', icon: '🍜', bg: 'bg-[#E0F2FE]', border: 'border-[#BAE6FD]', role: 'Chuyên gia nếm món' },
        { id: 'm3', name: 'Bé An', icon: '🥑', bg: 'bg-[#DCFCE7]', border: 'border-[#BBF7D0]', role: 'Trợ thủ dọn bàn' },
      ]
    };

    // --- VARIANT DEFINITIONS ---
    const VARIANTS = {
      'A': {
        key: 'A',
        name: 'Netflix Kitchen Cards',
        title: 'Phương Án A: Lưới Thẻ Đôi Phong Cách Netflix + Bottom Drawer',
        desc: 'Lưới 2 cột thẻ avatar vuông lớn mềm mại chuẩn phong cách chọn profile. Nút "Thêm thành viên" dạng pill to ghim dưới đáy, mở Bottom Drawer tiện tay ngón cái.',
      },
      'B': {
        key: 'B',
        name: 'Cozy Family Carousel',
        title: 'Phương Án B: Thẻ Tâm Điểm Lớn + Băng Chuyền Cuộn Ngang',
        desc: 'Cấu trúc thẻ tiêu điểm trung tâm hiển thị thành viên nổi bật kèm lời chào ấm áp, bên dưới là thanh cuộn ngang các thành viên khác. Form thêm mới dạng Center Dialog nổi.',
      },
      'C': {
        key: 'C',
        name: 'Kitchen Stack List',
        title: 'Phương Án C: Danh Sách Thẻ Hàng Ngang + Màn Hình Trượt Toàn Khung',
        desc: 'Cấu trúc danh sách thẻ ngang bo góc hiển thị tên kèm huy hiệu vai trò bếp. Cực kỳ tối ưu cho thao tác chạm một tay. Form thêm mới dạng trang trượt toàn màn hình.',
      }
    };

    let currentVariant = 'A';

    // Parse URL parameter ?variant=
    function initVariantFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const v = params.get('variant')?.toUpperCase();
      if (v && VARIANTS[v]) {
        currentVariant = v;
      }
    }

    function setVariant(key) {
      if (!VARIANTS[key]) return;
      currentVariant = key;
      const url = new URL(window.location.href);
      url.searchParams.set('variant', key);
      window.history.replaceState({}, '', url.toString());
      render();
    }

    function cycleVariant(direction) {
      const keys = Object.keys(VARIANTS);
      const currentIndex = keys.indexOf(currentVariant);
      let nextIndex = (currentIndex + direction + keys.length) % keys.length;
      setVariant(keys[nextIndex]);
    }

    // --- ACTIONS ---
    function selectMember(memberId) {
      state.selectedMemberId = memberId;
      state.activeScreen = 'plan';
      render();
    }

    function returnToSelect() {
      state.selectedMemberId = null;
      state.activeScreen = 'select';
      render();
    }

    function toggleManageMode() {
      state.isManageMode = !state.isManageMode;
      render();
    }

    function openAddModal(editingId = null) {
      state.editingMemberId = editingId;
      state.isAddModalOpen = true;
      render();
    }

    function closeAddModal() {
      state.isAddModalOpen = false;
      state.editingMemberId = null;
      render();
    }

    function saveMember(name, presetIndex) {
      const trimmed = name.trim();
      if (!trimmed) {
        alert('Vui lòng nhập tên thành viên!');
        return;
      }
      
      const preset = AVATAR_PRESETS[presetIndex] || AVATAR_PRESETS[0];

      if (state.editingMemberId) {
        // Edit existing
        const m = state.members.find(x => x.id === state.editingMemberId);
        if (m) {
          m.name = trimmed;
          m.icon = preset.icon;
          m.bg = preset.bg;
          m.border = preset.border;
        }
      } else {
        // Check duplicate name
        const exists = state.members.some(x => x.name.toLowerCase() === trimmed.toLowerCase());
        if (exists) {
          alert('Tên thành viên này đã có trong gia đình. Vui lòng chọn tên khác!');
          return;
        }

        const newId = 'm_' + Date.now();
        state.members.push({
          id: newId,
          name: trimmed,
          icon: preset.icon,
          bg: preset.bg,
          border: preset.border,
          role: 'Thành viên mới'
        });
      }

      state.isAddModalOpen = false;
      state.editingMemberId = null;
      render();
    }

    function deleteMember(memberId) {
      if (state.members.length <= 1) {
        alert('Gia đình phải có ít nhất 1 thành viên, không thể xóa thành viên cuối cùng!');
        return;
      }
      const target = state.members.find(m => m.id === memberId);
      if (confirm(`Bạn có chắc chắn muốn xóa thành viên "${target?.name}" khỏi danh sách?`)) {
        state.members = state.members.filter(m => m.id !== memberId);
        render();
      }
    }

    // --- RENDER HELPERS ---
    function updateStateSummary() {
      const selected = state.members.find(m => m.id === state.selectedMemberId);
      const text = `Gia đình ${state.householdCode} có ${state.members.length} Thành viên | ${
        selected ? `Đang vào bếp với tư cách: <strong>${selected.name} (${selected.icon})</strong>` : 'Đang ở màn hình chọn thành viên.'
      }`;
      document.getElementById('state-summary').innerHTML = text;
      document.getElementById('switcher-variant-key').textContent = `Phương án ${currentVariant}`;
      document.getElementById('switcher-variant-name').textContent = VARIANTS[currentVariant].name;
      document.getElementById('variant-title').textContent = VARIANTS[currentVariant].title;
      document.getElementById('variant-description').textContent = VARIANTS[currentVariant].desc;
    }

    // --- RENDER PLAN SCREEN (When a member enters) ---
    function renderPlanScreen() {
      const member = state.members.find(m => m.id === state.selectedMemberId) || state.members[0];
      return `
        <div class="flex-1 flex flex-col bg-[#FAFBFD]">
          <!-- App Header -->
          <div class="px-4 py-2.5 bg-white border-b border-slate-100 flex items-center justify-between gap-2 shadow-xs">
            <div class="flex items-center gap-1.5 flex-wrap min-w-0">
              <span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full bg-[#FEF7DC] text-[#334E68] border border-[#EFE4B5]">
                <svg class="w-3 h-3 text-[#5B7C99]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Mã: ${state.householdCode}
              </span>
              <span class="inline-flex items-center gap-1 text-xs font-semibold text-slate-700">
                <span class="w-5 h-5 rounded-full ${member.bg} ${member.border} border flex items-center justify-center text-[10px]">${member.icon}</span>
                ${member.name}
              </span>
              <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                🟢 Online
              </span>
            </div>
            <button onclick="returnToSelect()" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 text-[11px] font-semibold transition active:scale-95 flex items-center gap-1">
              <span>Đổi thành viên</span>
              <svg class="w-3 h-3 text-[#5B7C99]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
          </div>

          <!-- Plan View Mockup Content -->
          <div class="p-4 flex-1 overflow-y-auto space-y-4">
            <!-- Meal Tabs -->
            <div class="flex items-center justify-between bg-slate-100 p-1 rounded-2xl">
              <span class="flex-1 py-1 text-center text-xs text-slate-500 font-medium">Bữa Sáng</span>
              <span class="flex-1 py-1 text-center text-xs text-slate-500 font-medium">Bữa Trưa</span>
              <span class="flex-1 py-1.5 text-center text-xs font-bold bg-white text-[#334E68] rounded-xl shadow-xs">Bữa Tối ⭐</span>
            </div>

            <!-- Date Selector Row -->
            <div class="flex items-center justify-between bg-white p-2.5 rounded-2xl border border-slate-100 shadow-xs">
              <div class="flex items-center gap-1.5">
                <div class="w-7 h-7 rounded-full bg-[#FEF7DC] border border-[#EFE4B5] flex items-center justify-center text-[#5B7C99] font-bold text-xs">
                  T4
                </div>
                <div>
                  <div class="text-xs font-bold text-[#334E68]">Hôm nay, 07 Tháng 10</div>
                  <div class="text-[10px] text-slate-400">Tuần hiện tại</div>
                </div>
              </div>
              <span class="text-[11px] font-bold text-[#5B7C99] bg-[#F4F7F9] px-2 py-0.5 rounded-lg">2 món</span>
            </div>

            <!-- Dishes for Dinner -->
            <div class="space-y-2.5">
              <div class="text-xs font-bold text-[#334E68] flex items-center gap-1.5">
                <span>🍽️ Thực đơn Bữa Tối</span>
              </div>

              <!-- Dish Card 1 -->
              <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-xs flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                  <div class="w-10 h-10 rounded-xl bg-amber-50 border border-amber-200 flex items-center justify-center text-lg">
                    🍗
                  </div>
                  <div>
                    <div class="text-xs font-bold text-[#334E68]">Gà rang lá chanh</div>
                    <div class="text-[10px] text-slate-400">Món mặn • Ướp sẵn buổi chiều</div>
                  </div>
                </div>
                <span class="text-[11px] text-slate-400 px-2 py-1 bg-slate-50 rounded-lg font-medium">Chi tiết</span>
              </div>

              <!-- Dish Card 2 -->
              <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-xs flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                  <div class="w-10 h-10 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center justify-center text-lg">
                    🥗
                  </div>
                  <div>
                    <div class="text-xs font-bold text-[#334E68]">Canh cải xoong nấu thịt</div>
                    <div class="text-[10px] text-slate-400">Món canh • Nấu vừa chín tới</div>
                  </div>
                </div>
                <span class="text-[11px] text-slate-400 px-2 py-1 bg-slate-50 rounded-lg font-medium">Chi tiết</span>
              </div>
            </div>

            <!-- Comment Card Showing Author Nickname -->
            <div class="p-3 bg-[#FEF7DC]/80 border border-[#EFE4B5] rounded-2xl">
              <div class="flex items-center justify-between mb-1.5">
                <div class="flex items-center gap-1.5 text-[11px] font-bold text-[#334E68]">
                  <span>💬 Dặn dò của ${member.name}:</span>
                </div>
                <span class="text-[10px] text-slate-400">Vừa xong</span>
              </div>
              <p class="text-xs text-slate-700 leading-relaxed">
                "Hôm nay ${member.name} đã đi chợ mua đủ gà và rau tươi rồi nhé, tối cả nhà về sớm ăn cơm cùng nha!"
              </p>
            </div>
          </div>

          <!-- Bottom Nav Bar -->
          <div class="bg-white border-t border-slate-100 px-8 py-2.5 flex items-center justify-between flex-shrink-0">
            <div class="flex flex-col items-center gap-0.5 text-[#5B7C99] font-bold text-[11px]">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
              <span>Kế hoạch</span>
            </div>
            <div class="flex flex-col items-center gap-0.5 text-slate-400 text-[11px] font-medium">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
              <span>Menu</span>
            </div>
          </div>
        </div>
      `;
    }

    // --- VARIANT A: NETFLIX KITCHEN CARDS (2-Column Grid + Bottom Drawer) ---
    function renderVariantA() {
      return `
        <div class="flex-1 flex flex-col p-5 justify-between">
          <!-- Top Area: Household Badge & Header -->
          <div>
            <div class="flex items-center justify-between mb-4">
              <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#FEF7DC] text-[#334E68] border border-[#EFE4B5] text-xs font-bold">
                <span>🏠 Mã nhà:</span>
                <span class="tracking-wide">${state.householdCode}</span>
              </div>

              <button 
                onclick="toggleManageMode()" 
                class="text-xs font-semibold px-2.5 py-1 rounded-full ${
                  state.isManageMode 
                    ? 'bg-rose-50 text-rose-600 border border-rose-200' 
                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                } transition"
              >
                ${state.isManageMode ? 'Xong' : 'Chỉnh sửa'}
              </button>
            </div>

            <!-- Title & Subtitle -->
            <div class="text-center mb-6">
              <h2 class="text-2xl font-black text-[#334E68] tracking-tight">
                Ai đang vào bếp?
              </h2>
              <p class="text-xs text-slate-500 mt-1">
                ${state.isManageMode ? 'Chọn biểu tượng bút chì để sửa hoặc xóa thành viên' : 'Chọn thành viên của bạn để vào xem Kế hoạch'}
              </p>
            </div>

            <!-- 2-Column Grid Cards -->
            <div class="grid grid-cols-2 gap-3.5 max-h-[380px] overflow-y-auto p-1">
              ${state.members.map(m => `
                <div class="relative group">
                  <button
                    onclick="${state.isManageMode ? `openAddModal('${m.id}')` : `selectMember('${m.id}')`}"
                    class="w-full aspect-[4/4.4] rounded-3xl ${m.bg} border-2 ${m.border} p-3 flex flex-col items-center justify-center gap-2 shadow-sm hover:shadow-md transition active:scale-95 ${state.isManageMode ? 'animate-wiggle' : ''}"
                  >
                    <!-- Avatar Circle -->
                    <div class="w-16 h-16 rounded-2xl bg-white/80 backdrop-blur-xs shadow-xs flex items-center justify-center text-3xl">
                      ${m.icon}
                    </div>

                    <!-- Member Name -->
                    <div class="text-center w-full px-1">
                      <span class="block text-sm font-extrabold text-[#334E68] truncate">
                        ${m.name}
                      </span>
                      <span class="text-[10px] text-slate-500 font-medium block truncate">
                        ${m.role}
                      </span>
                    </div>
                  </button>

                  <!-- Delete button in manage mode -->
                  ${state.isManageMode ? `
                    <button 
                      onclick="event.stopPropagation(); deleteMember('${m.id}')"

    // --- VARIANT C: KITCHEN STACK LIST (Vertical Easy-Touch List + Full-screen Sheet) ---
    function renderVariantC() {
      return `
        <div class="flex-1 flex flex-col p-4 justify-between">
          <!-- Top Area -->

    // --- RENDER MODAL / DRAWER (Add Member Form) ---
    function renderAddMemberOverlay() {
      if (!state.isAddModalOpen) return '';

      const isEditing = Boolean(state.editingMemberId);
      const editingMember = isEditing ? state.members.find(m => m.id === state.editingMemberId) : null;
      const initialName = editingMember ? editingMember.name : '';
      const currentIconIndex = editingMember 
        ? AVATAR_PRESETS.findIndex(p => p.icon === editingMember.icon) 
        : 0;

      // VARIANT A: BOTTOM DRAWER (Slide Up)
      if (currentVariant === 'A') {
        return `
          <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-xs z-40 flex flex-col justify-end">
            <div class="bg-white rounded-t-[32px] p-5 shadow-2xl border-t border-slate-100 flex flex-col max-h-[90%] overflow-y-auto animate-in slide-in-from-bottom duration-200">
              <!-- Drawer Handle Pill -->
              <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-3"></div>

              <div class="flex items-center justify-between mb-3">
                <h3 class="text-base font-extrabold text-[#334E68]">
                  ${isEditing ? 'Chỉnh Sửa Thành Viên' : 'Thêm Thành Viên Mới'}
                </h3>
                <button onclick="closeAddModal()" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 hover:text-slate-700 flex items-center justify-center text-xs font-bold">
                  ✕
                </button>
              </div>

              <!-- Input Name -->
              <div class="mb-4">
                <label class="block text-xs font-bold text-[#334E68] mb-1.5">
                  Tên hoặc biệt danh trong gia đình:
                </label>
                <input 
                  id="input-member-name"
                  type="text" 
                  value="${initialName}"
                  placeholder="Ví dụ: Mẹ, Bố, Bé An, Chị Hai..." 
                  class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-sm font-bold text-[#334E68] placeholder-slate-400 focus:outline-none focus:border-[#5B7C99] focus:bg-white transition"
                  autofocus
                />
              </div>

              <!-- Avatar Selection Grid -->
              <div class="mb-5">
                <label class="block text-xs font-bold text-[#334E68] mb-1.5">
                  Chọn biểu tượng đại diện:
                </label>
                <div class="grid grid-cols-4 gap-2.5" id="preset-selector">
                  ${AVATAR_PRESETS.map((p, idx) => `
                    <button
                      type="button"
                      onclick="selectPreset(${idx})"
                      data-index="${idx}"
                      class="preset-item aspect-square rounded-2xl ${p.bg} border-2 ${p.border} flex flex-col items-center justify-center text-2xl transition active:scale-95 ${idx === (currentIconIndex === -1 ? 0 : currentIconIndex) ? 'ring-2 ring-[#5B7C99] scale-105' : 'opacity-80 hover:opacity-100'}"
                    >
                      <span>${p.icon}</span>
                      <span class="text-[9px] font-semibold text-slate-600 mt-0.5 truncate w-full text-center px-0.5">${p.label}</span>
                    </button>
                  `).join('')}
                </div>
              </div>

              <!-- Actions -->
              <div class="flex items-center gap-2">
                <button
                  type="button"
                  onclick="closeAddModal()"
                  class="flex-1 py-3 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition"
                >
                  Hủy
                </button>
                <button
                  type="button"
                  onclick="handleFormSubmit()"
                  class="flex-2 py-3 rounded-full bg-[#5B7C99] hover:bg-[#4a6b88] text-white font-bold text-xs shadow-md shadow-[#5B7C99]/30 transition active:scale-98"
                >
                  ${isEditing ? 'Lưu thay đổi' : 'Xác nhận tạo thành viên'}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // VARIANT B: CENTER DIALOG MODAL
      if (currentVariant === 'B') {
        return `
          <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-xs z-40 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-5 shadow-2xl border border-slate-100 w-full max-w-xs flex flex-col animate-in zoom-in-95 duration-150">
              <div class="text-center mb-3">
                <div class="w-14 h-14 rounded-2xl bg-[#FEF7DC] border-2 border-[#EFE4B5] mx-auto flex items-center justify-center text-3xl mb-2" id="preview-avatar-box">
                  ${AVATAR_PRESETS[currentIconIndex === -1 ? 0 : currentIconIndex].icon}
                </div>
                <h3 class="text-base font-extrabold text-[#334E68]">
                  ${isEditing ? 'Sửa thông tin' : 'Thành viên mới'}
                </h3>
              </div>

              <div class="mb-3">
                <input 
                  id="input-member-name"
                  type="text" 
                  value="${initialName}"
                  placeholder="Nhập tên của bạn..." 
                  class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold text-[#334E68] focus:outline-none focus:border-[#5B7C99]"
                />
              </div>

              <div class="mb-4">
                <div class="text-[11px] font-bold text-slate-500 mb-1.5 text-center">Bấm chọn icon yêu thích:</div>
                <div class="grid grid-cols-4 gap-2" id="preset-selector">
                  ${AVATAR_PRESETS.map((p, idx) => `
                    <button
                      type="button"
                      onclick="selectPreset(${idx})"
                      data-index="${idx}"
                      class="preset-item h-10 rounded-xl ${p.bg} border ${p.border} flex items-center justify-center text-lg ${idx === (currentIconIndex === -1 ? 0 : currentIconIndex) ? 'ring-2 ring-[#5B7C99]' : 'opacity-70'}"
                    >
                      ${p.icon}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="flex gap-2">
                <button onclick="closeAddModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs">Hủy</button>
                <button onclick="handleFormSubmit()" class="flex-1 py-2.5 rounded-xl bg-[#5B7C99] text-white font-bold text-xs">Lưu</button>
              </div>
            </div>
          </div>
        `;
      }

      // VARIANT C: SLIDE-IN FULL-SCREEN SHEET
      if (currentVariant === 'C') {
        return `
          <div class="absolute inset-0 bg-[#FAFBFD] z-40 flex flex-col p-5 justify-between animate-in slide-in-from-right duration-200">
            <div>
              <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
                <button onclick="closeAddModal()" class="text-xs font-bold text-slate-500 flex items-center gap-1">
                  ← Quay lại
                </button>
                <span class="text-xs font-extrabold text-[#334E68]">Bếp Nhà • ${state.householdCode}</span>
              </div>

              <h3 class="text-xl font-black text-[#334E68] mb-1">
                ${isEditing ? 'Cập nhật thành viên' : 'Thêm thành viên mới'}
              </h3>
              <p class="text-xs text-slate-400 mb-4">
                Người này sẽ xuất hiện trong danh sách chọn mỗi khi mở ứng dụng.
              </p>

              <div class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-[#334E68] mb-1">Tên thành viên:</label>
                  <input 
                    id="input-member-name"
                    type="text" 
                    value="${initialName}"
                    placeholder="Ví dụ: Bố, Mẹ, Bé Bắp..." 
                    class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 text-sm font-bold text-[#334E68] focus:border-[#5B7C99]"
                  />
                  <!-- Quick preset names -->
                  <div class="flex items-center gap-1.5 mt-2 flex-wrap">
                    <span class="text-[10px] text-slate-400">Gợi ý nhanh:</span>
                    ${['Bố', 'Mẹ', 'Bé Bi', 'Chị Hai', 'Bà Nội'].map(s => `
                      <button onclick="document.getElementById('input-member-name').value='${s}'" class="text-[10px] bg-slate-100 hover:bg-[#FEF7DC] px-2 py-0.5 rounded-md font-semibold text-slate-600">
                        ${s}
                      </button>
                    `).join('')}
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-[#334E68] mb-1.5">Biểu tượng nhà bếp:</label>
                  <div class="grid grid-cols-4 gap-2" id="preset-selector">
                    ${AVATAR_PRESETS.map((p, idx) => `
                      <button
                        type="button"
                        onclick="selectPreset(${idx})"
                        data-index="${idx}"
                        class="preset-item p-2.5 rounded-2xl ${p.bg} border ${p.border} flex flex-col items-center justify-center gap-1 ${idx === (currentIconIndex === -1 ? 0 : currentIconIndex) ? 'ring-2 ring-[#5B7C99]' : 'opacity-80'}"
                      >
                        <span class="text-xl">${p.icon}</span>
                        <span class="text-[9px] text-slate-600 font-medium">${p.label}</span>
                      </button>
                    `).join('')}
                  </div>
                </div>
              </div>
            </div>

            <div class="pt-3 border-t border-slate-200">
              <button 
                onclick="handleFormSubmit()"
                class="w-full py-3.5 rounded-2xl bg-[#5B7C99] text-white font-bold text-sm shadow-md"
              >
                Hoàn tất & Lưu vào bếp
              </button>
            </div>
          </div>
        `;
      }
    }

    let selectedPresetIndex = 0;

    function selectPreset(idx) {
      selectedPresetIndex = idx;
      const items = document.querySelectorAll('.preset-item');
      items.forEach((el, i) => {
        if (i === idx) {
          el.classList.add('ring-2', 'ring-[#5B7C99]', 'scale-105');
          el.classList.remove('opacity-70', 'opacity-80');
        } else {
          el.classList.remove('ring-2', 'ring-[#5B7C99]', 'scale-105');
          el.classList.add('opacity-70');
        }
      });

      // Update avatar box in Variant B if exists
      const previewBox = document.getElementById('preview-avatar-box');
      if (previewBox) {
        previewBox.textContent = AVATAR_PRESETS[idx].icon;
        previewBox.className = `w-14 h-14 rounded-2xl ${AVATAR_PRESETS[idx].bg} border-2 ${AVATAR_PRESETS[idx].border} mx-auto flex items-center justify-center text-3xl mb-2`;
      }
    }

    function handleFormSubmit() {
      const input = document.getElementById('input-member-name');
      if (!input) return;
      saveMember(input.value, selectedPresetIndex);
    }

    // --- MAIN RENDER PIPELINE ---
    function render() {
      const appRoot = document.getElementById('app-root');
      const overlayHost = document.getElementById('overlay-host');

      if (state.activeScreen === 'plan') {
        appRoot.innerHTML = renderPlanScreen();
        overlayHost.innerHTML = '';
      } else {
        if (currentVariant === 'A') {
          appRoot.innerHTML = renderVariantA();
        } else if (currentVariant === 'B') {
          appRoot.innerHTML = renderVariantB();
        } else {
          appRoot.innerHTML = renderVariantC();
        }
        overlayHost.innerHTML = renderAddMemberOverlay();
      }

      updateStateSummary();
    }

    // --- KEYBOARD NAVIGATION ---
    window.addEventListener('keydown', (e) => {
      // Don't cycle if typing in text inputs
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'ArrowLeft') {
        cycleVariant(-1);
      } else if (e.key === 'ArrowRight') {
        cycleVariant(1);
      }
    });

    // --- INITIAL BOOTSTRAP ---
    initVariantFromUrl();
    render();
  </script>
</body>
